name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build runtime image
        shell: bash
        run: ./gradlew runtimeZip --no-daemon

      - name: Rename archive
        shell: bash
        run: mv build/image.zip "build/Fabric-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Fabric-${{ matrix.name }}
          path: build/image/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fabric-${{ matrix.name }}.zip
