plugins {
    id 'java'
    id 'idea'
    id 'org.beryx.runtime' version '2.0.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

idea {
    module {
        inheritOutputDirs = true
    }
}

java {
    modularity.inferModulePath = true
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

group = 'com.derpderphurr'
version = '0.1.1'

application {
    mainClass = "com.derpderphurr.network.fabric.ui.Main"
}

runtime {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    modules = [
            'java.desktop',
            'java.xml',
            'java.logging',
            'java.sql',
            'java.naming',
            'java.compiler',
            'java.scripting',
            'java.management',
            'java.datatransfer',
            'java.security.sasl',
            'jdk.unsupported',
            'jdk.jfr',
            'jdk.unsupported.desktop']
}

javafx {
    version = '27'
    modules = [ 'javafx.controls','javafx.swing', 'javafx.fxml' ]
}

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.3")
    // Source: https://mvnrepository.com/artifact/org.snmp4j/snmp4j
    implementation("org.snmp4j:snmp4j:3.13.1")
    implementation("com.brunomnsilva:smartgraph:2.3.0")
}

test {
    useJUnitPlatform()
}